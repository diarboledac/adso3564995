<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>32-Clip-Path0</title>
    <link rel="stylesheet" href="../src/css/master.css">
<style >
    section{
        div.clip{
            background:url(../src/images/pittsburgh.jpg) no-repeat center/cover;
            margin: 2rem auto;
            height: 340px;
            width: 340px;
            transition:all 0.5s ease;

            &.clip1{
                clip-path:circle(25%);
                &:hover{
                    clip-path:circle(100%);
                }
            }
            &.clip2{
             clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                &:hover{
                    clip-path: polygon(50% 0%, 100% 0, 100% 34%, 100% 76%, 100% 100%, 47% 100%, 0 100%, 0 87%, 0 36%, 0 0);

                }
            }
            &.clip3{
              clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
                &:hover{
                    clip-path: polygon(20% 0%, 0 0, 0 48%, 0% 80%, 0 100%, 41% 100%, 100% 100%, 100% 80%, 100% 47%, 100% 0, 80% 0%, 49% 0);
                }
            }
            
        }
    }



</style>


</head>
