<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Text-Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
            p.txt{
                font-size:4rem ;
                font-weight: 600;
                margin: 1rem 0;
                text-align: center;
                &.txt1{
                    color: #000;
                    text-shadow: 0 0 6px white;
                }
                &.txt2{
                    color: #000;
                    text-shadow: -4px -4px 4px white;
                }
                &.txt3{
  color: #fff;
  text-shadow: 
    0 0 7px #fff,
    0 0 10px #fff,
    0 0 21px #fff,
    0 0 42px #0fa,
    0 0 82px #0fa,
    0 0 92px #0fa,
    0 0 102px #0fa,
    0 0 151px #0fa;
}
                &.txt4{
                    color: #000;
                    text-shadow:  -2px 0 8px #ffcc00,  /* Amarillo a la izquierda */
     2px 0 8px #00a859,  /* Verde a la derecha */
     
    /* Capas externas (resplandor de neón expandido) */
    -6px 0 20px #ffcc00, /* Resplandor amarillo */
     6px 0 20px #00a859, /* Resplandor verde */
    -12px 0 40px #ffcc00,
     12px 0 40px #00a859;
                }
            }

        }


    </style>

</head>

            <h3>Description</h3>
        </header>
        <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
