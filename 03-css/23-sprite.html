<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-Sprite</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div#runner {
                background: url(../src/images/run-sprite.png) no-repeat;
                height: 256px;
                margin: 2rem auto;
                width: 256px;
                /* Se añadió 'px' a los cálculos para que el navegador los interprete correctamente */
                &.sp1 { background-position: calc(-256px * 0) 0; }
                &.sp2 { background-position: calc(-256px * 1) 0; }
                &.sp3 { background-position: calc(-256px * 2) 0; }
                &.sp4 { background-position: calc(-256px * 3) 0; }
                &.sp5 { background-position: calc(-256px * 4) 0; }
                &.sp6 { background-position: calc(-256px * 5) 0; }
            }
            
            div#dino {
                background: url(../src/images/dino-sprite.png) no-repeat;
                height: 128px;
                margin: 2rem auto;
                width: 128px;
                /* Añadí frames extra. Ajusta la cantidad según el sprite real de tu dino */
                &.sp1 { background-position: calc(-128px * 0) 0; }
                &.sp2 { background-position: calc(-128px * 1) 0; }
              
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>23-Sprite</h1>
            <img src="../src/images/logo-css.png" alt="Html">
            <h3>Description</h3>
        </header>
        
        <!-- Elementos HTML añadidos para que el CSS y JS tengan a quién afectar -->
        <section>
            <div id="runner" class="sp1"></div>
            <div id="dino" class="sp1"></div>
        </section>
            
        <script>
            // === Lógica del Runner ===
            const runner = document.getElementById('runner');
            const runnerSprites = 6;
            let countRunner = 1;

            setInterval(() => {
                runner.className = "sp" + countRunner;
                countRunner++;
                if(countRunner > runnerSprites){
                    countRunner = 1;
                }
            }, 80);

            // === Lógica del Dino ===
            const dino = document.getElementById('dino');
            const dinoSprites = 2; // Ajusta este número según la cantidad de frames (sp) que tenga tu imagen del dino
            let countDino = 1;

            setInterval(() => {
                dino.className = "sp" + countDino;
                countDino++;
                if(countDino > dinoSprites){
                    countDino = 1;
                }
            }, 500); // Puedes ajustar la velocidad del dino independientemente
        </script>
    </main>
</body>
</html>
