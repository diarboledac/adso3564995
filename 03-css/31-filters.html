<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-Template</title>
    <link rel="stylesheet" href="../src/css/master.css">
<style>

    section{
        img.filter{
            background: linear-gradient(45deg,darkgreen,orchid);
            border-radius: 14px ;
            corner-shape: squircle;
            width: 140px;
            display: block;
            margin: 2rem auto;
            transition: all 1s ease;
            &.filter1{
            filter:grayscale(1)

            }
            &.filter2{
                filter:blur(8px);
            }
            &.filter3{
                filter:sepia(1);
            }
            &.filter4{
                filter:brightness(.5);
            }
            &.filter5{
                filter:invert();
            }
            &.filter6{
                filter:drop-shadow(0 0 12px #fff);
            }
            &.filter7{
                filter:hue-rotate(180deg);
                     }
            &:hover{
                filter:none;
            }

        }
    }


</style>

</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>00-Template</h1>
            <img src="../src/images/logo-css.png" alt="Html">
            <h3>Description</h3>
        </header>
       <section>
            <h3 class="subtitle">GrayScale</h3>
            <img class="filter filter1" src="../src/images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Blur</h3>
            <img class="filter filter2" src="../src/images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Sepia</h3>
            <img class="filter filter3" src="../src/images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Brightness</h3>
            <img class="filter filter4" src="../src/images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Invert</h3>
            <img class="filter filter5" src="../src/images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Drop Shadow</h3>
            <img class="filter filter6" src="../src/images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">HUE Rotate</h3>
            <img class="filter filter7" src="../src/images/inosuke.png" alt="Inosuke">
        </section>
    </main>
</body>
</html>
