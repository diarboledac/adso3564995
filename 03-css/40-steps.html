<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-Steps</title>
    <link rel="stylesheet" href="../src/css/master.css">

    <style>
        :root{
            --size: 256px;
        }
        body{
            overflow: hidden;
        }
        section{
           div.bg {
    background: url(../src/images/bg-steps.png) no-repeat center/cover;
    outline: 4px solid #fff;
    border-radius: 12px;
    position: relative;
    height: 540px;

    div.instructions{
        background-color:#0009;
        border-radius: 12px;
        corner-shape:squircle;
        color: #fff;
        font-size: 1.2rem;
        outline: 4px solid #fff;
        text-align: center;
        padding: 0.4rem;

        position: absolute;
        top: 25px;
        left: 25px;
        width: 300px;
    }

    div.trainer {
        background: url(../src/images/steps-all.png) no-repeat;
        background-position-x: 0;
        transform: scale(.8);
        position: absolute;
        bottom: 0;
        left: 50px;
        height: var(--size);
        width: var(--size);
        animation: 0.6s animTrainer steps(4) infinite;
        
        &.front { background-position-y: calc(var(--size) * 0); }
        &.left { background-position-y: calc(var(--size) * -1); }
        &.right { background-position-y: calc(var(--size) * -2); }
        &.back { background-position-y: calc(var(--size) * -3); }
    }
}
        }
        @keyframes animTrainer{
           
            100%{background-position-x:calc(var(--size) * -4);}
        }
    </style>



</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>40-Steps</h1>
            <img src="../src/images/logo-css.png" alt="Html">
            <h3>Description</h3>
        </header>
        <section>
            <h3 class="subtitle">Subtitle:</h3>
          <div class="bg">
            <div class="instructions">Please press arrow keys :
                <br>
                &larr; &uarr; &rarr; &darr;</div>
            <div class="trainer front"></div>
          </div>
        </section>
    </main>
    <script>
        const trainer = document.querySelector('.trainer');
        document.addEventListener('keyup', function(e) {
           
            switch (e.keyCode) {
                case 37: // left
                   trainer.classList.remove('front', 'back', 'right');
                   trainer.classList.add('left');
                    break;
                case 38: // up
                   trainer.classList.remove('left', 'back', 'right');
                   trainer.classList.add('front');
                    break;
                case 39: // right
                   trainer.classList.remove('front', 'back', 'left');
                   trainer.classList.add('right');
                    break;
                case 40: // down
                   trainer.classList.remove('front', 'right', 'left');
                   trainer.classList.add('back');
                    break;
            }
        });


    </script>
</body>
</html>
