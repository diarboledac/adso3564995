<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-Box-Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
            div.box{
                border: 4px solid #fff;
                background-color: #0009;
                height: 200px;
                width: 300px;
                margin: 2rem auto;
                &.box1{
                    box-shadow: 0 0 12px #fff;
                }
                &.box2{
                    box-shadow: -10px -10px 24px 0 #fff;
                }
                &.box3{
                    box-shadow: 0 0 20px #fff inset;
                }
                &.box4{
                    box-shadow:4px 4px 0 0 #ffcd00;
                    box-shadow:8px 8px 0 0 #003087;
                    box-shadow:12px 12px 0 0 red;
                }
            }
            div.images{
                text-align: center;
                img{
                    width: 160px;
                    &:first-of-type{
                        box-shadow: 0px 0px 12px 0 #fff;
                                           }
                    &:last-of-type{
                        filter:drop-shadow(0 0 12px #fff)
                    }
                }
            }
        }


    </style>


</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">

            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>27-Box-Shadow</h1>
            <img src="../src/images/logo-css.png" alt="Html">
            <h3>Description</h3>
        </header>
       <section>
            <h3 class="subtitle">box-shadow: 0 0 12px #fff</h3>
            <div class="box box1"></div>
            <h3 class="subtitle">box-shadow: -10px -10px 24px 0 #fff</h3>
            <div class="box box2"></div>
            <h3 class="subtitle">box-shadow: 0 0 20px #fff inset</h3>
            <div class="box box3"></div>
            <h3 class="subtitle">box-shadow: multiple</h3>
            <div class="box box4"></div>
            <h3 class="subtitle">box-shadow VS drop-shadow()</h3>
            <div class="images">
                <img src="../src/images/mario.png">
                <img src="../src/images/mario.png">
            </div>
        </section>
    </main>
