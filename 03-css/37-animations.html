    <style>
      section {
        div.jungle {
          outline: 4px solid #fff9;
          corner-shape: squircle;
          border-radius: 12px;
          background: url(../src/images/jungle.png) no-repeat center / contain;
          margin: 1rem auto;
          width: 360px;
          height: 440px;
          position: relative;
          img,
          div {
            position: absolute;
            top: 200px;
            left: 0;
            &.logo {
              top: 24px;
              left: 24px;
              animation: 2s animLogo infinite ease;
            }
            &.dk {
              top: 170px;
              left: 110px;
              width: 140px;
              animation: 2s animDK infinite ease;
            }
            &.move {
              top: 86px;
              left: 0px;
              animation: 4s animAttack infinite ease-in-out;
              img.ryno {
                width: 120px;
                animation: 0.25s animRyno infinite ease-in;
              }
            }
          }
        }
      }
    <style>
    section{
        div.jungle{
            outline: 4px solid #fff9;
            corner-shape: squircle;
            border-radius: 12px;
            background:url(../src/images/jungle.png)
                        no-repeat center /contain;
            margin: 1rem auto;
            width: 360px;
            height: 440px;
            position: relative;
            img,div{
                position: absolute;
                top: 200px ;
                left: 0;
                &.logo{
                    top: 24px;
                    left: 24px;
                    animation: 2s animLogo infinite ease;
                }
                &.dk{
                    top: 170px;
                    left: 110px;
                    width: 140px;
                    animation: 2s animDK infinite ease;
                }
                &.move{
                    top: 170px;
                    left:0px;
                    animation: 4s animAttack infinite ease-in;
                    img.ryno{
                        width: 120px;
                        animation: 0.25s animRyno infinite ease-in;
                    }
                }
            }
        }
    }
    
    @keyframes animLogo{
        0%,100%{
            transform:scale(.8);
        }
        50%{
            transform:scale(1.1);
        } 
    }
  
    @keyframes animDK{
        0%{transform:scale(1) rotateX(0deg); top:170px;}
        48%{transform:scale(.75) rotateX(0deg); top:70px;}
        52%{transform:scale(.75) rotateX(180deg); top:70px;}
        56%{transform:scale(.75) rotateX(0deg); top:70px;}
        80%{transform:scale(1) rotateX(0deg); top:170px;}
        81%{transform:scale(1) rotateX(0deg); top:170px;}
        100%{transform:scale(1) rotateX(0deg); top:170px;}
    }
    
    @keyframes animRyno{
        0%,100%{transform:translateY(0);}
        50%{transform:translateY(-12px);}
    }

@keyframes animAttack{

        0%{transform: scaleX(1); top:90px; left:0px;}

        30%{transform: scaleX(1); top:90px; left: 250px;}

        35%{transform: scaleX(-1); top:90px; left: 250px;}

        36%{transform: scaleX(-1); top:80px; left: 250px;}

        37%{transform: scaleX(-1); top:70px; left: 250px;}

        38%{transform: scaleX(-1); top:60px; left: 250px;}

        39%{transform: scaleX(-1); top:55px; left: 250px;}

        40%{transform: scaleX(-1); top:50px; left: 250px;}

        41%{transform: scaleX(-1); top:55px; left: 250px;}

        42%{transform: scaleX(-1); top:60px; left: 250px;}

        43%{transform: scaleX(-1); top:70px; left: 250px;}

        44%{transform: scaleX(-1); top:80px; left: 250px;}

        45%{transform: scaleX(-1); top:90px; left: 250px;}

        50%{transform: scaleX(-1); top:90px; left: 250px;}

        65%{transform: scaleX(1); top:90px; left: 110px;}

        100%{transform: scaleX(1); top:90px; left:0px;}

    } 
</style>
    </style>
