<section>
            <div class="menu">
                <a href="#elements">Elements</a>
                <a href="#example">Example</a>
            </div>
            <div id="elements">
                <h3>Inputs</h3>
                <div class="block">
                    <div class="input">
                        <h4>Text:</h4>
                        <input type="text">
                    </div>
                    <div class="input">
                        <h4>Password:</h4>
                        <input id="passw" type="password">
                        <button id="toggle-option">show</button>
                    </div>
                    <div class="input">
                        <h4>Number:</h4>
                        <input type="number">
                    </div>
                    <div class="input">
                        <h4>Range:</h4>
                        <input type="range" value="0" min="0" max="100" step="25" oninput="per.value=this.value+'%'">
                        <output id="per">0%</output>
                    </div>
                    <div class="input">
                        <h4>Color:</h4>
                        <input type="color" oninput="ccolor.value=this.value">
                        <output id="ccolor"></output>
                    </div>
                    <div class="input">
                        <h4>Date:</h4>
                        <input type="date">
                    </div>
                    <div class="input">
                        <h4>Time:</h4>
                        <input type="time">
                    </div>
                    <div class="input">
                        <h4>Week:</h4>
                        <input type="week">
                    </div>
                    <div class="input">
                        <h4>Month:</h4>
                        <input type="month">
                    </div>
                    <div class="input">
                        <h4>Email:</h4>
                        <input type="email">
                    </div>
                    <div class="input">
                        <h4>Search:</h4>
                        <input type="search">
                    </div>
                    <div class="input">
                        <h4>File:</h4>
                        <input type="file">
                    </div>
                    <div class="input">
                        <h4>Button:</h4>
                        <input type="button" value="Button">
                    </div>
                    <div class="input">
                        <h4>Submit:</h4>
                        <input type="submit" value="Submit">
                    </div>
                    <div class="input">
                        <h4>Reset:</h4>
                        <input type="reset" value="Reset">
                    </div>
                    <div class="input">
                        <h4>Radio:</h4>
                        <input type="radio" name="option" checked>
                        <input type="radio" name="option">
                    </div>
                    <div class="input">
                        <h4>CheckBox:</h4>
                        <input type="checkbox" name="option1" checked>
                        <input type="checkbox" name="option2">
                    </div>
                    <h3>Others Elements</h3>
                    <div class="input">
                        <h4>Progress:</h4>
                        <progress value="0.5"></progress>
                    </div>
                    <div class="input">
                        <h4>Select:</h4>
                        <select name="gender">
                            <option value="" selected>Select Gender...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="input">
                        <h4>Text Area:</h4>
                        <textarea cols="20" rows="4"></textarea>
                    </div>
                </div>
            </div>
            <div id="example">
                <h3>Example Form</h3>
                    <fieldset>
                        <legend>
                            <h4>Personal Data:</h4>
                        </legend>
                        <form action="" method="post">
                            <label for="">
                                Fullname:
                                <input type="text" name="fullname" required>
                            </label>
                            <label for="">
                                Email:
                                <input type="email" name="email" required>
                            </label>
                            <label for="">
                                BirthDate:
                                <input type="date" name="birthdate" required>
                            </label>
                            <label for="">
                                Gender:
                                <select name="gender" required>
                                    <option value="Female">Female</option>
                                    <option value="Male">Male</option>
                                </select>
                            </label>
                            <label>
                                <input type="submit" value="Send Data">
                                <input type="reset" value="Reset Data">
                            </label>
                        </form>
                    </fieldset>
            </div>
        </section>
